name: WorldDrug v2 integration validation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/worlddrug-ui-integration

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/worlddrug-ui-integration
          fetch-depth: 0

      - name: Verify published WorldDrug state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('apps/web/public/data/admin-catalog.json').read_text(encoding='utf-8'))
          registry = state.get('masterRegistry') or []
          assert len(registry) >= 250, f'WorldDrug registry unexpectedly small: {len(registry)}'
          assert any(item.get('id') == 'WD-0019' for item in registry), 'Expected WorldDrug entries are missing'
          print(f'Published Master Registry: {len(registry)} entries')
          PY

      - name: Apply final clinical and UI safeguards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('apps/web/lib/api-client.ts')
          text = api.read_text(encoding='utf-8')
          old = '''  if (!allowedGroups.includes(therapyGroup)) return false;\n  const text = normalizedName(`${entry.therapeuticAreas.join(" ")} ${entry.diabetesOrPhenotype ?? ""} ${(entry.primaryIndications ?? []).join(" ")} ${entry.guidelineRole ?? ""}`);'''
          new = '''  const explicitlyHandledNonGlycemic = normalizedName(entry.canonicalName).includes("resmetirom");\n  if (!allowedGroups.includes(therapyGroup) && !explicitlyHandledNonGlycemic) return false;\n  const text = normalizedName(`${entry.therapeuticAreas.join(" ")} ${entry.diabetesOrPhenotype ?? ""} ${(entry.primaryIndications ?? []).join(" ")} ${entry.guidelineRole ?? ""}`);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Type2 eligibility safeguard anchor missing')
          old2 = '''  if (/stage 2 t1d|delay onset.*type 1|type 1 diabetes prevention/.test(text)) return false;\n  return /diabetes|t2d|type 2|hyperglyc|glucose/.test(text);'''
          new2 = '''  if (/stage 2 t1d|delay onset.*type 1|type 1 diabetes prevention/.test(text)) return false;\n  if (explicitlyHandledNonGlycemic) return entry.sourceCodes.some((code) => /EASL|EMA|ADA/i.test(code));\n  return /diabetes|t2d|type 2|hyperglyc|glucose/.test(text);'''
          if old2 in text:
              text = text.replace(old2, new2, 1)
          elif new2 not in text:
              raise SystemExit('Type2 evidence safeguard anchor missing')

          old_effect = '''  for (const effect of entry.clinicalEffects) {\n    if (effect.domain === "glycemic_control") domains.add("diabetes");\n    if (effect.domain === "ascvd") { domains.add("ascvd"); domains.add("cardiovascular"); }\n    if (effect.domain === "heart_failure") { domains.add("heart_failure"); domains.add("cardiovascular"); }\n    if (effect.domain === "ckd") domains.add("kidney");\n    if (effect.domain === "weight") domains.add("obesity");\n    if (effect.domain === "masld_mash") { domains.add("masld_mash"); domains.add("liver"); }\n    if (effect.domain === "hypertension") domains.add("hypertension");\n    if (effect.domain === "lipids") domains.add("lipids");\n    if (effect.domain === "retinopathy") domains.add("retinopathy");\n    if (effect.domain === "neuropathy") domains.add("neuropathy");\n    if (effect.domain === "diabetic_foot") domains.add("diabetic_foot");\n  }'''
          new_effect = '''  for (const effect of entry.clinicalEffects) {\n    if (["neutral", "not_established"].includes(effect.direction)) continue;\n    if (effect.domain === "glycemic_control") domains.add("diabetes");\n    if (effect.domain === "ascvd") { domains.add("ascvd"); domains.add("cardiovascular"); }\n    if (effect.domain === "heart_failure") { domains.add("heart_failure"); domains.add("cardiovascular"); }\n    if (effect.domain === "ckd") domains.add("kidney");\n    if (effect.domain === "weight") domains.add("obesity");\n    if (effect.domain === "masld_mash") { domains.add("masld_mash"); domains.add("liver"); }\n    if (effect.domain === "hypertension") domains.add("hypertension");\n    if (effect.domain === "lipids") domains.add("lipids");\n    if (effect.domain === "retinopathy") domains.add("retinopathy");\n    if (effect.domain === "neuropathy") domains.add("neuropathy");\n    if (effect.domain === "diabetic_foot") domains.add("diabetic_foot");\n  }'''
          if old_effect in text:
              text = text.replace(old_effect, new_effect, 1)
          elif new_effect not in text:
              raise SystemExit('Clinical domain effect anchor missing')
          api.write_text(text, encoding='utf-8')

          theme = Path('apps/web/app/glymize-theme.css')
          text = theme.read_text(encoding='utf-8')
          text = text.replace('  --glymize-line: #dfe7e6;\n  --glymize-surface: #ffffff;\n  --glymize-surface-soft: #fafcfc;\n  --glymize-canvas: #f8faf9;', '  --glymize-line: #e1e6e8;\n  --glymize-surface: #ffffff;\n  --glymize-surface-soft: #fafbfc;\n  --glymize-canvas: #f7f8fa;')
          theme.write_text(text, encoding='utf-8')
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Production web build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_ADMIN_API_URL: ${{ vars.NEXT_PUBLIC_ADMIN_API_URL }}
        run: pnpm --filter @glymize/web... build

      - name: Commit validated safeguards
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No safeguard changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/api-client.ts apps/web/app/glymize-theme.css
          git commit -m "Refine WorldDrug clinical domain mapping"
          git push origin HEAD:fix/worlddrug-ui-integration
