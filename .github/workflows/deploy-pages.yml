name: Deploy GLYMIZE to GitHub Pages

on:
  push:
    branches:
      - main
      - agent/pwa-clinical-dashboard
      - agent/secure-admin-publishing
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application and admin Worker
        run: pnpm typecheck && pnpm test

      - name: Prepare versioned PWA
        run: node -e 'const fs=require("fs"); const version=process.env.GITHUB_SHA; fs.writeFileSync("apps/web/public/version.json", JSON.stringify({version,builtAt:new Date().toISOString()},null,2)+"\n"); const path="apps/web/public/sw.js"; fs.writeFileSync(path,fs.readFileSync(path,"utf8").replaceAll("__GLYMIZE_BUILD_VERSION__",version));'

      - name: Build static application
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_ADMIN_API_URL: ${{ vars.NEXT_PUBLIC_ADMIN_API_URL }}
        run: pnpm --filter @glymize/web... build

      - name: Disable Jekyll processing
        run: touch apps/web/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out

  deploy:
    if: ${{ vars.NEXT_PUBLIC_ADMIN_API_URL != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
