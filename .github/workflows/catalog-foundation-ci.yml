name: Catalog foundation validation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/catalog-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/catalog-foundation
          fetch-depth: 0
      - name: Apply catalog foundation code migration
        run: python tools/apply_catalog_foundation_patch.py
      - name: Migrate published catalog state
        run: python tools/migrate_published_catalog.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Commit validated migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/src/index.ts apps/web/lib/api-client.ts apps/web/app/admin/medications/page.tsx apps/web/app/admin/page.tsx apps/web/app/theme-overrides.css apps/admin-worker/src/index.ts apps/web/public/data/admin-catalog.json
          git commit -m "Apply validated catalog and publication migration"
          git push origin HEAD:fix/catalog-foundation
